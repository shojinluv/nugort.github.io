<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chợ Nugỏrt · Sàn đồ lặt vặt cho căn phòng nhỏ</title>
  <meta name="description" content="Trang chủ một sàn thương mại điện tử tự dựng bằng HTML, CSS và JavaScript thuần. Bài tập giao diện của Shojinluv.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Thanh đầu trang, chân trang và hộp đăng nhập được chèn vào từ assets/js/common.js -->
  <main class="wrap layout">
    <aside class="sidebar">
      <h2><svg aria-hidden="true"><use href="#i-list"></use></svg> Danh mục</h2>
      <ul class="cats" id="cats"></ul>
    </aside>

    <section class="content" aria-label="Sản phẩm">
      <div class="toolbar">
        <span class="toolbar__label hide-sm">Sắp xếp theo</span>
        <div class="toolbar__sorts" id="sorts">
          <button class="btn is-active" type="button" data-sort="popular">Phổ biến</button>
          <button class="btn" type="button" data-sort="newest">Mới nhất</button>
          <button class="btn" type="button" data-sort="sold">Bán chạy</button>
        </div>
        <label class="sr-only" for="price-sort">Sắp xếp theo giá</label>
        <select class="select" id="price-sort">
          <option value="">Giá</option>
          <option value="asc">Giá: thấp đến cao</option>
          <option value="desc">Giá: cao đến thấp</option>
        </select>
        <span class="toolbar__count" id="result-count" aria-live="polite"></span>
      </div>

      <ul class="grid" id="grid"></ul>
      <p class="none" id="none" hidden>Không tìm thấy món nào. Thử từ khóa khác, hoặc hỏi con mèo xem nó giấu ở đâu.</p>
      <nav class="pager" id="pager" aria-label="Phân trang"></nav>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
