<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chợ Nugỏrt · Sàn đồ lặt vặt cho căn phòng nhỏ</title>
  <meta name="description" content="Trang chủ một sàn thương mại điện tử tự dựng bằng HTML, CSS và JavaScript thuần. Bài tập giao diện của Shojinluv.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Thanh đầu trang, chân trang và hộp đăng nhập được chèn vào từ assets/js/common.js -->
  <main class="wrap layout">
    <aside class="sidebar">
      <h2>
        <button class="sidebar__toggle" id="cats-toggle" type="button" aria-expanded="true" aria-controls="cats">
          <svg aria-hidden="true"><use href="#i-list"></use></svg> Danh mục
          <svg class="sidebar__chevron" aria-hidden="true"><use href="#i-back"></use></svg>
        </button>
      </h2>
      <ul class="cats" id="cats"></ul>

      <!-- Bộ lọc: điện thoại thì gập lại sau một nút, màn rộng thì mở sẵn (bấm tiêu đề để gập như phần Danh mục) -->
      <section class="filters" id="filters" aria-label="Bộ lọc">
        <h2 class="filters__head">
          <button class="sidebar__toggle filters__toggle" id="filters-toggle" type="button" aria-expanded="true" aria-controls="filters-body">
            <svg aria-hidden="true"><use href="#i-filter"></use></svg> Bộ lọc
            <span class="filters__badge" id="filters-badge" hidden></span>
            <svg class="sidebar__chevron" aria-hidden="true"><use href="#i-back"></use></svg>
          </button>
        </h2>
        <div class="filters__body" id="filters-body">
          <form class="filters__group" id="price-form" novalidate>
            <h3>Khoảng giá</h3>
            <div class="price-range">
              <label class="sr-only" for="price-min">Giá thấp nhất</label>
              <input class="price-range__input" id="price-min" inputmode="numeric" placeholder="₫ TỪ" autocomplete="off">
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="price-max">Giá cao nhất</label>
              <input class="price-range__input" id="price-max" inputmode="numeric" placeholder="₫ ĐẾN" autocomplete="off">
            </div>
            <p class="filters__hint">Gõ tắt kiểu 100k hay 2tr cũng được</p>
            <p class="filters__error" id="price-error" role="alert" hidden>Giá thấp nhất đang lớn hơn giá cao nhất</p>
            <button class="btn btn--primary filters__apply" type="submit">Áp dụng</button>
            <div class="chips chips--sm" id="price-presets"></div>
          </form>
          <div class="filters__group">
            <h3>Đánh giá</h3>
            <div class="rates" id="rates"></div>
          </div>
          <div class="filters__group">
            <h3>Của riêng bạn</h3>
            <button class="chip chip--sm" id="fav-only" type="button" aria-pressed="false">♥ Món đã thả tim <span id="fav-n"></span></button>
          </div>
          <button class="btn filters__clear" id="filters-clear" type="button">Xóa tất cả bộ lọc</button>
        </div>
      </section>
    </aside>

    <section class="content" aria-label="Sản phẩm">
      <!-- Flash sale: mỗi khung giờ chẵn đổi một lượt món, đồng hồ đếm ngược tới hết khung giờ -->
      <section class="flash" id="flash" aria-labelledby="flash-title">
        <div class="flash__head">
          <h2 class="flash__title" id="flash-title"><span aria-hidden="true">⚡</span> Flash sale</h2>
          <p class="flash__timer">
            <span class="flash__label">Kết thúc sau</span>
            <span class="flash__clock" aria-hidden="true"><b id="flash-h">00</b>:<b id="flash-m">00</b>:<b id="flash-s">00</b></span>
            <span class="sr-only" id="flash-sr"></span>
          </p>
        </div>
        <ul class="flash__list" id="flash-list"></ul>
      </section>

      <div class="toolbar">
        <span class="toolbar__label hide-sm">Sắp xếp theo</span>
        <div class="toolbar__sorts" id="sorts">
          <button class="btn is-active" type="button" data-sort="popular" aria-pressed="true">Phổ biến</button>
          <button class="btn" type="button" data-sort="newest" aria-pressed="false">Mới nhất</button>
          <button class="btn" type="button" data-sort="sold" aria-pressed="false">Bán chạy</button>
        </div>
        <label class="sr-only" for="price-sort">Sắp xếp theo giá</label>
        <select class="select" id="price-sort">
          <option value="">Giá</option>
          <option value="asc">Giá: thấp đến cao</option>
          <option value="desc">Giá: cao đến thấp</option>
        </select>
        <span class="toolbar__count" id="result-count" aria-live="polite"></span>
      </div>

      <!-- Các bộ lọc đang bật, bấm ✕ để bỏ từng cái -->
      <div class="active-filters" id="active-filters" hidden>
        <ul class="active-filters__list" id="active-list" aria-label="Bộ lọc đang bật"></ul>
        <button class="active-filters__clear" type="button" data-unset="all">Xóa tất cả</button>
      </div>

      <ul class="grid" id="grid"></ul>
      <p class="none" id="none" hidden></p>
      <nav class="pager" id="pager" aria-label="Phân trang"></nav>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
